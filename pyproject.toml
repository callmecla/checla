[project]
name = "checla"
version = "0.1.0"
description = "Check before you trust: network and payment safety toolkit"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0",
    "flet-camera>=1.0",
    "flet-permission-handler>=1.0",
    "httpx>=0.27",
    # Pinned to versions Flet hosts prebuilt for Android/iOS (pypi.flet.dev)
    "opencv-python-headless==5.0.0.93",
    "numpy==2.5.4",
]

[tool.flet]
product = "Checla"
org = "com.callmecla"

[tool.flet.android.permission]
"android.permission.CAMERA" = true
